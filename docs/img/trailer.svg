<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title id="t">Yes First, 20 second trailer</title>
<desc id="d">Contacts are sorted into New, Never, Wait, Reply and Follow-up. One personal text is drafted per person. The owner decides yes, no or change. Then the job is tested: round 1 passes 1 of 3 cases. Drafts only, mock data.</desc>
<rect width="1000" height="562" fill="#101826"/>
<g opacity="1"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.155;0.175;1"/><text x="80" y="250" font-size="104" fill="#F1F3F6" font-weight="800" text-anchor="start" opacity="0">Yes first.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.01;0.0275;1"/></text><text x="80" y="312" font-size="30" fill="#A0A8B4" font-weight="400" text-anchor="start" opacity="0">An outreach agent that drafts, and cannot send.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.05;0.0675;1"/></text><text x="80" y="356" font-size="30" fill="#A0A8B4" font-weight="400" text-anchor="start" opacity="0">Five personal texts per run. You decide. You send.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.085;0.1025;1"/></text><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.06;0.0775;1"/>
  <path d="M80 450H920" stroke="#6B9BFF" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M80 500H620" stroke="#FF9A4A" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="80" cy="450" r="11" fill="#101826" stroke="#6B9BFF" stroke-width="5"/><circle cx="300" cy="450" r="11" fill="#101826" stroke="#6B9BFF" stroke-width="5"/><circle cx="520" cy="450" r="11" fill="#101826" stroke="#6B9BFF" stroke-width="5"/><circle cx="740" cy="450" r="11" fill="#101826" stroke="#6B9BFF" stroke-width="5"/>
  <circle cx="80" cy="500" r="11" fill="#101826" stroke="#FF9A4A" stroke-width="5"/><circle cx="300" cy="500" r="11" fill="#101826" stroke="#FF9A4A" stroke-width="5"/><circle cx="520" cy="500" r="11" fill="#101826" stroke="#FF9A4A" stroke-width="5"/>
