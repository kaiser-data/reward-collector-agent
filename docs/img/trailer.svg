</g></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.175;0.195;0.38;0.4;1"/><text x="80" y="110" font-size="44" fill="#F1F3F6" font-weight="800" text-anchor="start" opacity="0">Your contacts, sorted<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.19;0.2075;1"/></text><text x="80" y="190" font-size="30" fill="#F1F3F6" font-weight="600" text-anchor="start" opacity="0">Felix Auer<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.215;0.2325;1"/></text><rect x="360" y="160" width="150" height="42" rx="8" fill="none" stroke="#5CC2A3" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.215;0.2325;1"/></rect><text x="435" y="190" font-size="23" fill="#5CC2A3" font-weight="700" text-anchor="middle" opacity="0">New<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.215;0.2325;1"/></text><text x="540" y="190" font-size="21" fill="#A0A8B4" font-weight="400" text-anchor="start" opacity="0">did a free intro lab and asked what comes next<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.215;0.2325;1"/></text><text x="80" y="260" font-size="30" fill="#F1F3F6" font-weight="600" text-anchor="start" opacity="0">Ben Okafor<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2425;0.26;1"/></text><rect x="360" y="230" width="150" height="42" rx="8" fill="none" stroke="#EE7B75" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2425;0.26;1"/></rect><text x="435" y="260" font-size="23" fill="#EE7B75" font-weight="700" text-anchor="middle" opacity="0">Never<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2425;0.26;1"/></text><text x="540" y="260" font-size="21" fill="#A0A8B4" font-weight="400" text-anchor="start" opacity="0">asked to be left alone<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2425;0.26;1"/></text><text x="80" y="330" font-size="30" fill="#F1F3F6" font-weight="600" text-anchor="start" opacity="0">Mira Kovac<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.27;0.2875;1"/></text><rect x="360" y="300" width="150" height="42" rx="8" fill="none" stroke="#E0A24A" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.27;0.2875;1"/></rect><text x="435" y="330" font-size="23" fill="#E0A24A" font-weight="700" text-anchor="middle" opacity="0">Wait<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.27;0.2875;1"/></text><text x="540" y="330" font-size="21" fill="#A0A8B4" font-weight="400" text-anchor="start" opacity="0">last message 4 days ago<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.27;0.2875;1"/></text><text x="80" y="400" font-size="30" fill="#F1F3F6" font-weight="600" text-anchor="start" opacity="0">Sara Lindqvist<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2975;0.315;1"/></text><rect x="360" y="370" width="150" height="42" rx="8" fill="none" stroke="#6B9BFF" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2975;0.315;1"/></rect><text x="435" y="400" font-size="23" fill="#6B9BFF" font-weight="700" text-anchor="middle" opacity="0">Reply<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2975;0.315;1"/></text><text x="540" y="400" font-size="21" fill="#A0A8B4" font-weight="400" text-anchor="start" opacity="0">wrote back and asked for a price<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2975;0.315;1"/></text><text x="80" y="470" font-size="30" fill="#F1F3F6" font-weight="600" text-anchor="start" opacity="0">Paul Richter<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.325;0.3425;1"/></text><rect x="360" y="440" width="150" height="42" rx="8" fill="none" stroke="#E0A24A" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.325;0.3425;1"/></rect><text x="435" y="470" font-size="23" fill="#E0A24A" font-weight="700" text-anchor="middle" opacity="0">Follow-up<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.325;0.3425;1"/></text><text x="540" y="470" font-size="21" fill="#A0A8B4" font-weight="400" text-anchor="start" opacity="0">no reply for 25 days<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.325;0.3425;1"/></text><text x="80" y="530" font-size="28" fill="#FF9A4A" font-weight="600" text-anchor="start" opacity="0">Never means never. Only career switchers get a message.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.355;0.3725;1"/></text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.605;0.625;1"/><text x="80" y="100" font-size="44" fill="#F1F3F6" font-weight="800" text-anchor="start" opacity="0">One text per person<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.415;0.4325;1"/></text><rect x="80" y="140" width="840" height="380" rx="14" fill="#17222C" stroke="#2B3946" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.42;0.4375;1"/></rect><text x="120" y="190" font-size="22" fill="#A0A8B4" font-weight="400" text-anchor="start" opacity="0">To: nadia.brandt@example.com<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.435;0.4525;1"/></text><text x="120" y="240" font-size="28" fill="#F1F3F6" font-weight="400" text-anchor="start" opacity="0">Hi Nadia,<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.455;0.4725;1"/></text><text x="120" y="282" font-size="24" fill="#F1F3F6" font-weight="400" text-anchor="start" opacity="0">Building your ward&#39;s shift spreadsheet and enjoying it<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.475;0.4925;1"/></text><text x="120" y="324" font-size="24" fill="#F1F3F6" font-weight="400" text-anchor="start" opacity="0">sounds like a good sign for data work.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.495;0.5125;1"/></text><text x="120" y="366" font-size="24" fill="#F1F3F6" font-weight="400" text-anchor="start" opacity="0">Data Analytics Starter runs 12 weeks part-time<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.515;0.5325;1"/></text><text x="120" y="408" font-size="24" fill="#F1F3F6" font-weight="400" text-anchor="start" opacity="0">and needs no coding to start.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.535;0.5525;1"/></text><text x="120" y="450" font-size="24" fill="#FF9A4A" font-weight="400" text-anchor="start" opacity="0">I&#39;m an ambassador and may earn a reward if you sign up.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.555;0.5725;1"/></text><text x="120" y="492" font-size="24" fill="#F1F3F6" font-weight="400" text-anchor="start" opacity="0">Is data the move you&#39;re thinking about?<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.575;0.5925;1"/></text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.625;0.645;0.755;0.775;1"/><text x="80" y="140" font-size="44" fill="#F1F3F6" font-weight="800" text-anchor="start" opacity="0">You decide<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.64;0.6575;1"/></text><rect x="130" y="230" width="220" height="96" rx="16" fill="#5CC2A3" stroke="#5CC2A3" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.65;0.6675;1"/></rect><text x="240" y="292" font-size="40" fill="#101826" font-weight="800" text-anchor="middle" opacity="0">Yes<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.65;0.6675;1"/></text><rect x="390" y="230" width="220" height="96" rx="16" fill="none" stroke="#2B3946" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.66;0.6775;1"/></rect><text x="500" y="292" font-size="40" fill="#F1F3F6" font-weight="800" text-anchor="middle" opacity="0">No<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.66;0.6775;1"/></text><rect x="650" y="230" width="220" height="96" rx="16" fill="none" stroke="#2B3946" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.67;0.6875;1"/></rect><text x="760" y="292" font-size="40" fill="#F1F3F6" font-weight="800" text-anchor="middle" opacity="0">Change<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.67;0.6875;1"/></text><rect x="122" y="222" width="236" height="112" rx="22" fill="none" stroke="#FF9A4A" stroke-width="4" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.695;0.7125;1"/></rect><text x="80" y="420" font-size="30" fill="#F1F3F6" font-weight="600" text-anchor="start" opacity="0">Nothing leaves without your yes to the exact words.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.715;0.7325;1"/></text><text x="80" y="466" font-size="26" fill="#A0A8B4" font-weight="400" text-anchor="start" opacity="0">The agent has no way to send.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.73;0.7475;1"/></text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.775;0.795;0.905;0.925;1"/><text x="80" y="110" font-size="44" fill="#F1F3F6" font-weight="800" text-anchor="start" opacity="0">Then it gets tested<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.79;0.8075;1"/></text><rect x="80" y="160" width="260" height="220" rx="14" fill="#17222C" stroke="#2B3946" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.81;0.8275;1"/></rect><text x="210" y="205" font-size="28" fill="#F1F3F6" font-weight="700" text-anchor="middle" opacity="0">Case 1<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.81;0.8275;1"/></text><text x="210" y="236" font-size="19" fill="#A0A8B4" font-weight="400" text-anchor="middle" opacity="0">normal run<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.81;0.8275;1"/></text><text x="210" y="322" font-size="84" fill="#EE7B75" font-weight="800" text-anchor="middle" opacity="0">✗<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.81;0.8275;1"/></text><text x="210" y="358" font-size="22" fill="#EE7B75" font-weight="700" text-anchor="middle" opacity="0">0 of 1 pass<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.81;0.8275;1"/></text><rect x="370" y="160" width="260" height="220" rx="14" fill="#17222C" stroke="#2B3946" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.83;0.8475;1"/></rect><text x="500" y="205" font-size="28" fill="#F1F3F6" font-weight="700" text-anchor="middle" opacity="0">Case 4<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.83;0.8475;1"/></text><text x="500" y="236" font-size="19" fill="#A0A8B4" font-weight="400" text-anchor="middle" opacity="0">unclear input<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.83;0.8475;1"/></text><text x="500" y="322" font-size="84" fill="#EE7B75" font-weight="800" text-anchor="middle" opacity="0">✗<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.83;0.8475;1"/></text><text x="500" y="358" font-size="22" fill="#EE7B75" font-weight="700" text-anchor="middle" opacity="0">0 of 3 pass<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.83;0.8475;1"/></text><rect x="660" y="160" width="260" height="220" rx="14" fill="#17222C" stroke="#2B3946" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.85;0.8675;1"/></rect><text x="790" y="205" font-size="28" fill="#F1F3F6" font-weight="700" text-anchor="middle" opacity="0">Case 5<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.85;0.8675;1"/></text><text x="790" y="236" font-size="19" fill="#A0A8B4" font-weight="400" text-anchor="middle" opacity="0">hidden orders, a trap<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.85;0.8675;1"/></text><text x="790" y="322" font-size="84" fill="#5CC2A3" font-weight="800" text-anchor="middle" opacity="0">✓<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.85;0.8675;1"/></text><text x="790" y="358" font-size="22" fill="#5CC2A3" font-weight="700" text-anchor="middle" opacity="0">3 of 3 pass<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.85;0.8675;1"/></text><text x="80" y="442" font-size="30" fill="#F1F3F6" font-weight="700" text-anchor="start" opacity="0">Round 1: 1 of 3 cases pass.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.865;0.8825;1"/></text><text x="80" y="488" font-size="24" fill="#A0A8B4" font-weight="400" text-anchor="start" opacity="0">The two failures point to one rule to decide.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.885;0.9025;1"/></text></g><g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.925;0.945;0.98;1"/><text x="500" y="270" font-size="60" fill="#F1F3F6" font-weight="800" text-anchor="middle" opacity="0">Drafts only. Mock data.<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.94;0.9575;1"/></text><text x="500" y="330" font-size="26" fill="#A0A8B4" font-weight="400" text-anchor="middle" opacity="0">github.com/kaiser-data/my-agent<animate attributeName="opacity" dur="20s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.95;0.9675;1"/></text></g><rect x="0" y="556" width="0" height="6" fill="#FF9A4A"><animate attributeName="width" dur="20s" repeatCount="indefinite" values="0;1000" keyTimes="0;1"/></rect>
